<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Same fingerprint, different file</title>
<style>
  :root {
    --bg: #0d1117; --soft: #161b22; --border: #30363d;
    --text: #d7dee8; --muted: #93a1b3;
    --i1: #58a6ff; --i2: #f0883e; --fp: #bc8cff;
    --ok: #3fb950; --bad: #f85149; --warn: #d29922;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: center; }
  section { position: absolute; inset: 0; padding: 56px 64px; display: none; flex-direction: column; }
  section.on { display: flex; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--muted); text-decoration-thickness: 3px; text-underline-offset: 8px; }
  a:hover { text-decoration-color: var(--fp); }
  code { font-family: var(--mono); background: var(--soft); border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; }
  h1 { font-size: 72px; margin: 0; color: #fff; text-align: center; }
  h2 { font-size: 52px; margin: 0; color: #fff; display: flex; align-items: center; gap: 20px; }
  h2 .n { width: 64px; height: 64px; border-radius: 50%; background: var(--border); display: inline-grid; place-items: center; font-size: 36px; }
  .sub { margin: 10px 0 0 84px; font-size: 30px; color: var(--muted); }
  .cover { justify-content: center; align-items: center; gap: 48px; }
  .cover img { width: 1250px; }
  .cover img, .cover .ph { max-width: 1400px; max-height: 620px; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 20px 60px #0008; }
  .cover .ph { width: 1100px; height: 520px; display: grid; place-items: center; border-style: dashed; color: var(--muted); font-family: var(--mono); font-size: 28px; box-shadow: none; }
  svg.d { width: 1472px; height: 680px; margin-top: auto; margin-bottom: auto; }
  #ctr { position: fixed; right: 18px; bottom: 12px; color: #5b6675; font: 14px var(--mono); }

  /* diagram vocabulary */
  .i1 { color: var(--i1); } .i2 { color: var(--i2); } .fpc { color: var(--fp); }
  .file .ino { fill: currentColor; font: 15px var(--mono); text-anchor: middle; opacity: .85; }
  .file .num { fill: currentColor; font: 700 32px var(--mono); text-anchor: middle; }
  .ghost { opacity: .4; } .ghost > use:first-child { stroke-dasharray: 8 7; }
  .fn { font: 22px var(--mono); text-anchor: middle; }
  .fn.i1 { fill: var(--i1); } .fn.i2 { fill: var(--i2); } .fn.gh { fill: var(--i1); opacity: .5; }
  .harv rect { fill: #3fb95022; stroke: var(--ok); stroke-width: 2.5; }
  .harv text { fill: var(--ok); font: 600 26px var(--sans); text-anchor: middle; dominant-baseline: central; }
  .harv.s text { font-size: 17px; }
  .pill rect { fill: var(--bg); stroke-width: 3; }
  .pill text { font: 26px var(--mono); text-anchor: middle; dominant-baseline: central; }
  .pill.c rect { stroke: var(--fp); } .pill.c text { fill: var(--fp); }
  .pill.p1 rect { stroke: var(--i1); } .pill.p1 text { fill: var(--i1); }
  .pill.p2 rect { stroke: var(--i2); } .pill.p2 text { fill: var(--i2); }
  .pill.x rect { stroke: var(--bad); } .pill.x text { fill: var(--bad); } .pill.x line { stroke: var(--bad); stroke-width: 3; }
  .base { fill: none; stroke: var(--border); stroke-width: 8; stroke-linecap: round; }
  .ov { fill: none; stroke-width: 30; stroke-linecap: round; stroke-opacity: .35; }
  .ov.ok { stroke: var(--ok); } .ov.bad { stroke: var(--bad); }
  .arr { fill: none; stroke-width: 4; stroke-linecap: round; }
  .arr.ok { stroke: var(--ok); } .arr.m { stroke: var(--muted); } .arr.bad { stroke: var(--bad); }
  .dash { stroke-dasharray: 10 9; }
  .lbl { fill: var(--muted); font: 26px var(--mono); text-anchor: middle; }
  .warn { fill: var(--warn); font: italic 26px var(--sans); text-anchor: middle; }
  .badtxt { fill: var(--bad); font: 700 26px var(--sans); text-anchor: middle; }
  .badge circle { stroke: var(--bg); stroke-width: 4; }
  .badge text { fill: #fff; font: 700 26px var(--sans); text-anchor: middle; dominant-baseline: central; }
  .badge.ok circle { fill: var(--ok); } .badge.bad circle { fill: var(--bad); } .badge.q circle { fill: var(--border); }
  .panel { fill: var(--soft); stroke: var(--border); stroke-width: 2; }
  .dir { fill: none; stroke: var(--muted); stroke-width: 2.5; stroke-dasharray: 9 7; opacity: .7; }
  .step circle { fill: var(--border); } .step text { fill: #fff; font: 700 22px var(--sans); text-anchor: middle; dominant-baseline: central; }
  .cap { fill: var(--text); font: 23px var(--sans); text-anchor: middle; }
  .small { fill: var(--muted); font: 17px var(--sans); text-anchor: middle; }
  .pfn { font: 15px var(--mono); text-anchor: middle; }
  .pfn.i1 { fill: var(--i1); } .pfn.i2 { fill: var(--i2); }
  [data-step] { transition: opacity .25s; }
  [data-step].hidden { opacity: 0; }
</style>
</head>

<div id="ctr"></div>

<script>
  const stage = document.getElementById('stage');
  const slides = [...document.querySelectorAll('section')];
  const ctr = document.getElementById('ctr');
  let i = 0, s = 0;

  const steps = el => Math.max(0, ...[...el.querySelectorAll('[data-step]')].map(e => +e.dataset.step));

  function fit() {
    const k = Math.min(innerWidth / 1600, innerHeight / 900);
    stage.style.transform = `translate(-50%, -50%) scale(${k})`;
  }

  function render() {
    slides.forEach((el, k) => el.classList.toggle('on', k === i));
    slides[i].querySelectorAll('[data-step]').forEach(e => e.classList.toggle('hidden', +e.dataset.step > s));
    ctr.textContent = `${i + 1} / ${slides.length}`;
    history.replaceState(null, '', '#' + (i + 1));
  }

  function next() {
    if (s < steps(slides[i])) s++;
    else if (i < slides.length - 1) { i++; s = 0; }
    render();
  }

  function prev() {
    if (s > 0) s--;
    else if (i > 0) { i--; s = steps(slides[i]); }
    render();
  }

  addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { i = 0; s = 0; render(); }
    else if (e.key === 'End') { i = slides.length - 1; s = steps(slides[i]); render(); }
    else if (e.key === 'f') document.documentElement.requestFullscreen?.();
  });
  addEventListener('click', e => { if (!e.target.closest('a')) next(); });
  addEventListener('resize', fit);

  const h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= slides.length) { i = h - 1; s = steps(slides[i]); }
  fit();
  render();
</script>
